name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Build with placeholder env vars so the required-env guard passes while
      # still validating that the app compiles. Real values are injected by the
      # deploy platform (AI Studio) at build time.
      - run: npm run build
        env:
          VITE_CONVEX_URL: "https://ci-placeholder.convex.cloud"
          VITE_CLERK_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
